<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ドライバー情報共有（試作）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bar:#141821;          /* 上下バーの濃い色 */
    --bar2:#1d2431;
    --ink:#eef2f7;
    --muted:#9aa7b8;
    --closure:#333b47;      /* 通行止め=ピン */
    --enforce:#2f6fe0;      /* 取締り=青ピン */
    --jam:#e23b3b;          /* 渋滞=赤ピン */
    --accident:#8e44ad;     /* 事故=紫ピン */
    --disaster:#e8963a;     /* 災害=オレンジピン */
    --other:#6b7280;        /* その他=グレーピン */
    --teal:#12b3a6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  /* 上部タイトルバー */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--bar);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);flex:0 0 auto;box-shadow:0 0 0 4px rgba(18,179,166,.18)}
  .topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
  .topbar .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .topbar .clear{margin-left:auto;background:var(--bar2);color:var(--muted);border:0;border-radius:8px;
    padding:8px 11px;font-size:12px;font-weight:600}
  /* 下部ヒント */
  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);
    z-index:1000;background:rgba(20,24,33,.92);color:var(--ink);padding:9px 15px;border-radius:999px;
    font-size:13px;font-weight:600;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap}
  /* 現在地ボタン */
  .locate{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 60px);z-index:1000;
    width:50px;height:50px;border-radius:50%;border:0;background:#fff;color:#141821;font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
  /* 現在地マーカー（地図上に光る点で表示） */
  .mypos{width:16px;height:16px;border-radius:50%;background:var(--teal);border:3px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative}
  .mypos::after{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
    border-radius:50%;background:rgba(18,179,166,.5);animation:mypulse 1.8s ease-out infinite}
  @keyframes mypulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  /* ピンの見た目 */
  .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.4);border:2px solid #fff}
  .pin span{transform:rotate(45deg);font-size:16px;line-height:1}
  .pin.adjusting{box-shadow:0 0 0 7px rgba(18,179,166,.35),0 3px 6px rgba(0,0,0,.4);cursor:grab}
  /* 位置調整の下部ヒント */
  .adjusthint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);
    z-index:1500;display:none;align-items:center;gap:10px;background:var(--teal);color:#052a27;
    padding:8px 8px 8px 16px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .adjusthint.show{display:flex}
  .adjusthint button{background:rgba(5,42,39,.18);color:#052a27;border:0;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700}
  /* 種類チューザー（下から出るシート） */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--bar);
    border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(110%);transition:transform .22s ease;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
  .sheet.open{transform:translateY(0)}
  .sheet h2{font-size:15px;margin:2px 0 14px;text-align:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .type{border:0;border-radius:14px;padding:16px 10px;color:#fff;font-size:16px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .type .ico{font-size:26px}
  .cancel{width:100%;margin-top:12px;background:var(--bar2);color:var(--muted);border:0;border-radius:12px;
    padding:14px;font-size:15px;font-weight:600}
  /* 詳細シート */
  .detail .row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .detail .badge{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
  .detail .ttl{font-size:17px;font-weight:700}
  .detail .ago{font-size:12px;color:var(--muted);margin-top:2px}
  .vote{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .vote button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700}
  .vote .up{background:rgba(18,179,166,.16);color:#39d3c6}
  .vote .down{background:rgba(226,59,59,.14);color:#ff7b7b}
  .vote button.chosen{outline:2px solid currentColor}
  /* コメント欄 */
  .comments{max-height:34vh;overflow-y:auto;margin:2px 0 12px;-webkit-overflow-scrolling:touch}
  .comments .empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0}
  .cmt{background:var(--bar2);border-radius:12px;padding:9px 12px;margin-bottom:8px}
  .cmt .cmtrow{display:flex;align-items:flex-start;gap:8px}
  .cmt .txt{flex:1;min-width:0;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .cmt .cdel{flex:0 0 auto;background:transparent;border:0;color:var(--muted);font-size:15px;padding:0 2px;line-height:1.5}
  .cmt .meta{font-size:10px;color:var(--muted);margin-top:3px}
  .cbar{display:flex;gap:8px;margin-bottom:12px}
  .cbar input{flex:1;min-width:0;background:var(--bar2);border:1px solid #2a3341;color:var(--ink);
    border-radius:12px;padding:12px 14px;font-size:15px}
  .cbar input::placeholder{color:#6c7a8c}
  .cbar .send{flex:0 0 auto;border:0;border-radius:12px;padding:0 16px;background:var(--teal);color:#052a27;font-weight:700;font-size:14px}
  .del{width:100%;background:transparent;color:var(--muted);border:0;padding:12px;font-size:13px}
  .adjust{width:100%;background:rgba(18,179,166,.14);color:#39d3c6;border:0;border-radius:12px;
    padding:14px;font-size:14px;font-weight:700;margin-bottom:8px}
  .note{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.5}

  /* 音声ボタン */
  .voiceBtn{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 118px);z-index:1000;
    width:56px;height:56px;border-radius:50%;border:0;background:var(--teal);color:#052a27;font-size:24px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
  .voiceBtn.listening{background:var(--jam);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,59,59,.5)}70%{box-shadow:0 0 0 16px rgba(226,59,59,0)}100%{box-shadow:0 0 0 0 rgba(226,59,59,0)}}
  .voiceToast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 182px);
    z-index:1500;background:rgba(20,24,33,.94);color:#fff;padding:10px 16px;border-radius:14px;
    font-size:13px;font-weight:600;max-width:86vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.35);
    display:none;align-items:center;justify-content:center;gap:10px}
  .voiceToast.show{display:flex}
  .voiceToast .undoBtn{flex:0 0 auto;background:rgba(255,255,255,.24);color:#fff;border:0;border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
  /* コメント欄の音声入力ボタン */
  .cmic{flex:0 0 auto;border:0;border-radius:12px;width:44px;background:var(--bar2);color:var(--ink);
    font-size:18px;display:flex;align-items:center;justify-content:center}
  .cmic.listening{background:var(--jam);color:#fff;animation:pulse 1s infinite}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="dot"></div>
  <div>
    <h1>ドライバー情報共有</h1>
    <div class="sub">試作版 ・ 地図をタップして報告</div>
  </div>
  <button class="clear" id="clearBtn">全消去</button>
</div>

<div class="hint">地図をタップして情報を追加</div>
<div class="adjusthint" id="adjustHint"><span>ピンをドラッグして位置を調整</span><button id="adjustDone">完了</button></div>
<button class="locate" id="locateBtn" title="現在地">◎</button>
<button class="voiceBtn" id="voiceBtn" title="音声で報告">🎤</button>
<div class="voiceToast" id="voiceToast"></div>

<!-- 種類チューザー -->
<div class="sheet" id="chooser">
  <h2>この地点の情報は？</h2>
  <div class="grid">
    <button class="type" style="background:var(--closure)" data-type="closure"><span class="ico">🚧</span>通行止め</button>
    <button class="type" style="background:var(--enforce)" data-type="enforce"><span class="ico">🚓</span>取締り</button>
    <button class="type" style="background:var(--jam)" data-type="jam"><span class="ico">🐌</span>渋滞</button>
    <button class="type" style="background:var(--accident)" data-type="accident"><span class="ico">💥</span>事故</button>
    <button class="type" style="background:var(--disaster)" data-type="disaster"><span class="ico">🌀</span>災害</button>
    <button class="type" style="background:var(--other)" data-type="other"><span class="ico">📝</span>その他</button>
  </div>
  <button class="cancel" id="chooserCancel">キャンセル</button>
</div>

<!-- 詳細シート -->
<div class="sheet detail" id="detail">
  <div class="row">
    <div class="badge" id="dBadge"></div>
    <div>
      <div class="ttl" id="dTitle"></div>
      <div class="ago" id="dAgo"></div>
    </div>
  </div>
  <div class="vote">
    <button class="up" id="voteUp">👍 まだある</button>
    <button class="down" id="voteDown">👎 もう無い</button>
  </div>
  <div class="comments" id="cList"></div>
  <div class="cbar">
    <input id="cInput" type="text" placeholder="コメントを追加…（例：迂回路あり）" maxlength="140">
    <button class="cmic" id="cMicBtn" title="音声でコメント">🎤</button>
    <button class="send" id="cSend">送信</button>
  </div>
  <button class="adjust" id="adjustBtn">📍 位置を調整</button>
  <button class="del" id="delBtn">この報告を削除</button>
  <div class="note">投票はいつでも変更できます。👍で長持ち／👎で早く消えます。<br>🎤で話すとコメントが自動送信されます。時間が経つと自動で消えます。</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== 種類の設定 ===== */
const TYPES = {
  closure:  {name:"通行止め", emoji:"🚧", color:"#333b47", shape:"point"},
  jam:      {name:"渋滞",     emoji:"🐌", color:"#e23b3b", shape:"point"},
  enforce:  {name:"取締り",   emoji:"🚓", color:"#2f6fe0", shape:"point"},
  accident: {name:"事故",     emoji:"💥", color:"#8e44ad", shape:"point"},
  disaster: {name:"災害",     emoji:"🌀", color:"#e8963a", shape:"point"},
  other:    {name:"その他",   emoji:"📝", color:"#6b7280", shape:"point"},
};
const BASE_LIFE = 60;      // 基本の寿命（分）
const UP_BONUS  = 15;      // 👍1回で延びる分
const DOWN_PEN  = 20;      // 👎1回で縮む分
const DOWN_KILL = 3;       // 👎がこの数に達したら即消去

let pins = [];             // {id,type,shape:'point',lat,lng,..}
let selectedId = null;
let pendingLatLng = null;
let uid = null;            // この端末＝1アカウントの代わり（本番はログインID）

/* ===== 地図 ===== */
const map = L.map('map', {
  zoomControl:false,
  zoomSnap:0.25,          // ズーム段階を細かくし、指の動きに滑らかに追従させる
  zoomDelta:1,            // ダブルタップ等1回の操作でのズーム量を大きく
  wheelPxPerZoomLevel:50  // PCのホイール操作をより速く反応させる
}).setView([36.2048,138.2529], 5); // 日本全体
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

/* ===== 保存（この端末に保存。実際のアプリではサーバーで全員に共有） ===== */
async function save(){
  try{ if(window.storage) await window.storage.set('pins', JSON.stringify(pins), false); }catch(e){}
}
async function loadUid(){
  try{
    if(window.storage){
      const r = await window.storage.get('uid', false);
      if(r && r.value){ uid = r.value; return; }
    }
  }catch(e){}
  uid = 'u_' + Math.random().toString(36).slice(2,10);
  try{ if(window.storage) await window.storage.set('uid', uid, false); }catch(e){}
}
async function load(){
  try{
    if(window.storage){
      const r = await window.storage.get('pins', false);
      if(r && r.value) pins = JSON.parse(r.value);
      pins.forEach(p=>{ if(!p.comments) p.comments=[]; if(!p.votes) p.votes={}; if(!p.shape) p.shape='point'; });
    }
  }catch(e){ pins = []; }
}

/* ===== 寿命の計算 ===== */
function ageMin(p){ return (Date.now()-p.createdAt)/60000; }
function upCount(p){ return Object.values(p.votes||{}).filter(v=>v==='up').length; }
function downCount(p){ return Object.values(p.votes||{}).filter(v=>v==='down').length; }
function myVote(p){ return (p.votes||{})[uid] || null; }
function lifeMin(p){ return BASE_LIFE + upCount(p)*UP_BONUS - downCount(p)*DOWN_PEN; }
function isDead(p){ return downCount(p)>=DOWN_KILL || ageMin(p) > lifeMin(p); }
function purge(){
  const before = pins.length;
  pins = pins.filter(p=>!isDead(p));
  if(pins.length!==before) save();
}
function agoText(p){
  const m = Math.floor(ageMin(p));
  if(m<1) return "たった今";
  if(m<60) return m+"分前";
  return Math.floor(m/60)+"時間前";
}

/* ===== 描画 ===== */
let adjustId = null;   // ドラッグで位置調整中のピンID
function render(){
  layer.clearLayers();
  pins.forEach(p=>{
    const t = TYPES[p.type];
    const fade = Math.max(.4, 1 - ageMin(p)/lifeMin(p));   // 古いほど薄く
    if(p.shape==='line'){
      const seg=[[p.lat,p.lng],[p.lat2,p.lng2]];
      // 黒線が地図に埋もれないよう白い縁取りを下に敷く
      L.polyline(seg,{color:'#fff',weight:9,opacity:fade*0.9}).addTo(layer).on('click',()=>openDetail(p.id));
      L.polyline(seg,{color:t.line,weight:5,opacity:fade}).addTo(layer).on('click',()=>openDetail(p.id));
    }else{
      const adjusting = (p.id === adjustId);
      const html = `<div class="pin${adjusting?' adjusting':''}" style="background:${t.color};opacity:${fade}"><span>${t.emoji}</span></div>`;
      const icon = L.divIcon({html, className:'', iconSize:[34,34], iconAnchor:[17,34]});
      const marker = L.marker([p.lat,p.lng],{icon, draggable:adjusting}).addTo(layer);
      if(adjusting){
        marker.on('dragend', ev=>{
          const pos = ev.target.getLatLng();
          p.lat = pos.lat; p.lng = pos.lng;
          save();
        });
      }else{
        marker.on('click', ()=>openDetail(p.id));
      }
    }
  });
}

/* ===== 追加 ===== */
function newId(){ return Date.now()+"_"+Math.random().toString(36).slice(2,6); }
function addPoint(type, latlng){
  if(!latlng) return null;
  const p = {id:newId(), shape:'point', type, lat:latlng.lat, lng:latlng.lng,
    createdAt:Date.now(), votes:{}, comments:[]};
  pins.push(p);
  save(); render();
  return p.id;
}

/* ===== シート開閉 ===== */
const chooser=document.getElementById('chooser');
const detail=document.getElementById('detail');
function openChooser(latlng){ pendingLatLng=latlng; detail.classList.remove('open'); chooser.classList.add('open'); }
function closeChooser(){ chooser.classList.remove('open'); pendingLatLng=null; }
function openDetail(id){
  selectedId=id; chooser.classList.remove('open');
  const p=pins.find(x=>x.id===id); if(!p) return;
  const t=TYPES[p.type];
  const badge=document.getElementById('dBadge');
  badge.textContent=t.emoji; badge.style.background=t.color+'33';
  document.getElementById('dTitle').textContent=t.name + (p.shape==='line'?'（区間）':'');
  document.getElementById('dAgo').textContent=`${agoText(p)} ・ 👍${upCount(p)} 👎${downCount(p)}`;
  const up=document.getElementById('voteUp'), down=document.getElementById('voteDown');
  const mine=myVote(p);
  up.classList.toggle('chosen', mine==='up');
  down.classList.toggle('chosen', mine==='down');
  up.textContent   = mine==='up'   ? '✅ まだある' : '👍 まだある';
  down.textContent = mine==='down' ? '✅ もう無い' : '👎 もう無い';
  renderComments(p);
  detail.classList.add('open');
}
function cmtAgo(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return "たった今";
  if(m<60) return m+"分前";
  const h=Math.floor(m/60); if(h<24) return h+"時間前";
  return Math.floor(h/24)+"日前";
}
function renderComments(p){
  const list=document.getElementById('cList');
  if(!p.comments || p.comments.length===0){
    list.innerHTML='<div class="empty">まだコメントはありません。最初の情報を書き込みましょう。</div>';
    return;
  }
  list.innerHTML = p.comments.map(c=>
    `<div class="cmt"><div class="cmtrow"><div class="txt"></div>${c.uid===uid?'<button class="cdel" title="このコメントを削除">✕</button>':''}</div><div class="meta"></div></div>`
  ).join('');
  const rows=list.querySelectorAll('.cmt');
  p.comments.forEach((c,i)=>{
    const row=rows[i]; if(!row) return;
    row.querySelector('.txt').textContent=c.text;
    row.querySelector('.meta').textContent=cmtAgo(c.at);
    const btn=row.querySelector('.cdel');
    if(btn){
      btn.addEventListener('click', ()=>{
        p.comments.splice(i,1);
        save();
        renderComments(p);
      });
    }
  });
}
function addComment(){
  const inp=document.getElementById('cInput');
  const text=(inp.value||'').trim();
  const p=pins.find(x=>x.id===selectedId);
  if(!text || !p) return;
  if(!p.comments) p.comments=[];
  p.comments.push({text, at:Date.now(), uid});
  inp.value=''; save(); renderComments(p);
  const list=document.getElementById('cList'); list.scrollTop=list.scrollHeight;
}
function closeDetail(){ detail.classList.remove('open'); selectedId=null; }

/* ===== 操作 ===== */
map.on('click', e=>{ if(adjustId) return; openChooser(e.latlng); });
document.querySelectorAll('.type').forEach(b=>{
  b.addEventListener('click',()=>{
    const type=b.dataset.type, start=pendingLatLng;   // closeChooserでnullになる前に控える
    closeChooser();
    addPoint(type, start);
  });
});
document.getElementById('chooserCancel').addEventListener('click', closeChooser);

/* ===== 位置調整（ドラッグでピンをずらす） ===== */
const adjustHint = document.getElementById('adjustHint');
function startAdjust(id){
  adjustId = id;
  detail.classList.remove('open');
  adjustHint.classList.add('show');
  render();
}
function endAdjust(){
  const id = adjustId;
  adjustId = null;
  adjustHint.classList.remove('show');
  render();
  if(id) openDetail(id);
}
document.getElementById('adjustBtn').addEventListener('click', ()=>{
  if(selectedId) startAdjust(selectedId);
});
document.getElementById('adjustDone').addEventListener('click', endAdjust);

function castVote(dir){
  const p=pins.find(x=>x.id===selectedId); if(!p) return;
  if(!p.votes) p.votes={};
  if(p.votes[uid] === dir) return;      // 同じ投票を連打しても何もしない（変更は可能）
  p.votes[uid]=dir; save();
  if(isDead(p)){ pins=pins.filter(x=>x.id!==p.id); render(); closeDetail(); return; }
  render(); openDetail(p.id);
}
document.getElementById('voteUp').addEventListener('click',()=>castVote('up'));
document.getElementById('voteDown').addEventListener('click',()=>castVote('down'));

/* ===== 現在地 ===== */
document.getElementById('locateBtn').addEventListener('click',()=>{
  if(myLatLng){ map.setView([myLatLng.lat, myLatLng.lng], 14); return; }
  if(!navigator.geolocation){ alert('この端末では位置情報が使えません'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=> map.setView([pos.coords.latitude,pos.coords.longitude], 14),
    ()=> alert('位置情報を取得できませんでした。位置情報の許可設定をご確認ください'),
    {timeout:6000}
  );
});

  // 起動時にそっと現在地へ寄せる（許可された場合だけ）
  if(navigator.geolocation){

    );

/* ===== 音声で報告 ===== */
const voiceBtn = document.getElementById('voiceBtn');
const voiceToast = document.getElementById('voiceToast');

// 現在地・進行方向(heading)・速度を継続的に追跡（距離指定の精度向上に使う）
let myLatLng = null;   // {lat,lng}
let myHeading = null;  // 度(0=北,90=東…)。停止中や非対応端末ではnull
let myMarker = null;   // 現在地に表示する光る点
let myAccuracyCircle = null;  // 位置精度の範囲を示す円
let accuracyNotified = false; // 初回の精度案内を1回だけ出すためのフラグ
function updateMyMarker(accuracy){
  if(!myLatLng) return;
  const latlng = [myLatLng.lat, myLatLng.lng];
  if(!myMarker){
    const icon = L.divIcon({html:'<div class="mypos"></div>', className:'', iconSize:[16,16], iconAnchor:[8,8]});
    myMarker = L.marker(latlng, {icon, interactive:false, zIndexOffset:-1000}).addTo(map);
  }else{
    myMarker.setLatLng(latlng);
  }
  if(typeof accuracy === 'number' && !isNaN(accuracy)){
    if(!myAccuracyCircle){
      myAccuracyCircle = L.circle(latlng, {radius:accuracy, color:'#12b3a6', weight:1,
        fillColor:'#12b3a6', fillOpacity:.12, interactive:false}).addTo(map);
    }else{
      myAccuracyCircle.setLatLng(latlng);
      myAccuracyCircle.setRadius(accuracy);
    }
    if(!accuracyNotified){
      accuracyNotified = true;
      showVoiceToast(`位置精度：誤差約${Math.round(accuracy)}m（屋外・電波の良い場所で改善します）`, 4000);
    }
  }
}
function startLocationWatch(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos=>{
      myLatLng = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      const h = pos.coords.heading;
      myHeading = (typeof h === 'number' && !isNaN(h)) ? h : null;
      updateMyMarker(pos.coords.accuracy);
    },
    ()=>{},
    {enableHighAccuracy:true, maximumAge:4000, timeout:8000}
  );
}
startLocationWatch();

// メッセージ表示。undoIdを渡すと「元に戻す」ボタン付きで表示(音声入力の誤り対策)
function showVoiceToast(msg, ms, undoId){
  voiceToast.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  voiceToast.appendChild(span);
  if(undoId){
    const btn = document.createElement('button');
    btn.className = 'undoBtn';
    btn.textContent = '元に戻す';
    btn.addEventListener('click', ()=>{
      pins = pins.filter(x=>x.id!==undoId);
      save(); render();
      voiceToast.classList.remove('show');
    });
    voiceToast.appendChild(btn);
  }
  voiceToast.classList.add('show');
  clearTimeout(voiceToast._t);
  voiceToast._t = setTimeout(()=>voiceToast.classList.remove('show'), ms || 2600);
}

// 発言から種類を判定するキーワード表(簡易版)
const VOICE_RULES = [
  {type:'jam',      words:['渋滞','混んで','混雑','詰まって']},
  {type:'closure',  words:['通行止め','通行止','封鎖','塞がって','工事']},
  {type:'enforce',  words:['取締り','取り締まり','ねずみ捕り','検問','スピード']},
  {type:'accident', words:['事故','衝突','追突','転倒']},
  {type:'disaster', words:['災害','台風','大雨','洪水','土砂','冠水','地震','積雪','大雪']},
  {type:'other',    words:['その他','その他情報']},
];
function detectType(text){
  for(const rule of VOICE_RULES){
    if(rule.words.some(w=>text.includes(w))) return rule.type;
  }
  return null;
}
// 「この先1キロ」「500メートル先」のような距離表現を拾う
function detectDistanceKm(text){
  let m = text.match(/(\d+(?:\.\d+)?)\s*(?:キロ|km)/);
  if(m) return parseFloat(m[1]);
  m = text.match(/(\d+(?:\.\d+)?)\s*(?:メートル|m)/);
  if(m) return parseFloat(m[1]) / 1000;
  return null;
}
// 距離と進行方向(heading)から着地点を計算。方向が取れない時は無理に飛ばさず現在地に置く
function offsetLatLng(base, km, headingDeg){
  if(!base || !km) return base;
  if(headingDeg == null) return base;   // 方角不明→誤った方向に飛ばさないための安全策
  const rad = headingDeg * Math.PI / 180;
  const dLat = (km / 111) * Math.cos(rad);
  const dLng = (km / (111 * Math.cos(base.lat * Math.PI / 180))) * Math.sin(rad);
  return {lat: base.lat + dLat, lng: base.lng + dLng};
}

let recognition = null;
let listening = false;
function getRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'ja-JP';
  r.interimResults = false;
  r.maxAlternatives = 1;
  return r;
}
function startListening(){
  if(listening) return;
  recognition = getRecognition();
  if(!recognition){
    showVoiceToast('この端末では音声入力に対応していません', 3000);
    return;
  }
  listening = true;
  voiceBtn.classList.add('listening');
  showVoiceToast('聞いています…「この先渋滞」など話してください', 4000);
  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    handleVoiceText(text);
  };
  recognition.onerror = ()=>{
    showVoiceToast('うまく聞き取れませんでした。もう一度お試しください', 3000);
  };
  recognition.onend = ()=>{
    listening = false;
    voiceBtn.classList.remove('listening');
  };
  recognition.start();
}
function handleVoiceText(text){
  const type = detectType(text);
  if(!type){
    showVoiceToast(`「${text}」→ 種類を判定できませんでした`, 3400);
    return;
  }
  if(!myLatLng){
    showVoiceToast('現在地が取得できていません。位置情報を確認してください', 3200);
    return;
  }
  const km = detectDistanceKm(text);
  let targetLatLng = myLatLng, note = '';
  if(km){
    targetLatLng = offsetLatLng(myLatLng, km, myHeading);
    if(myHeading == null) note = '（進行方向が取れず現在地に設置）';
  }
  const pinId = addPoint(type, targetLatLng);
  const label = TYPES[type].name;
  showVoiceToast(`${TYPES[type].emoji} ${label}のピンを立てました${note}`, 4200, pinId);
}
voiceBtn.addEventListener('click', ()=>{
  if(listening){ recognition && recognition.stop(); return; }
  startListening();
});

/* ===== コメント欄の音声入力（運転中に手を使わず入力） ===== */
const cMicBtn = document.getElementById('cMicBtn');
let cRecognition = null;
let cListening = false;
function startCommentListening(){
  if(cListening) return;
  const p = pins.find(x=>x.id===selectedId);
  if(!p){ showVoiceToast('報告が選択されていません', 2400); return; }
  cRecognition = getRecognition();
  if(!cRecognition){
    showVoiceToast('この端末では音声入力に対応していません', 3000);
    return;
  }
  cListening = true;
  cMicBtn.classList.add('listening');
  showVoiceToast('コメントを聞いています…', 3600);
  cRecognition.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    const inp = document.getElementById('cInput');
    inp.value = text;
    addComment();
    showVoiceToast(`コメントを追加しました：「${text}」`, 3200);
  };
  cRecognition.onerror = ()=>{
    showVoiceToast('うまく聞き取れませんでした。もう一度お試しください', 3000);
  };
  cRecognition.onend = ()=>{
    cListening = false;
    cMicBtn.classList.remove('listening');
  };
  cRecognition.start();
}
cMicBtn.addEventListener('click', ()=>{
  if(cListening){ cRecognition && cRecognition.stop(); return; }
  startCommentListening();
});

/* 30秒ごとに古い報告を掃除して更新 */
setInterval(()=>{ purge(); render(); if(selectedId){ const p=pins.find(x=>x.id===selectedId); p?openDetail(p.id):closeDetail(); } }, 30000);
</script>
